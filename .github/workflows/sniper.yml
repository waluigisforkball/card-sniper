name: card-sniper
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay a few minutes)
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency: card-sniper

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python sniper.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
      - name: Save seen listings
        if: always()
        run: |
          git config user.name "card-sniper"
          git config user.email "card-sniper@users.noreply.github.com"
          git add seen.json || true
          git add wantlist.json || true
          git diff --cached --quiet || (git commit -m "update seen listings" && git push)
